# Meldet Cockpit live, wie ein Lauf ausging (A-092): Ausrollen, Rauchtest, Kandidat, Release. Das
# Ereignis steht im Event-Center mit Repo, Lauf, Commit und Link zum Lauf; die KI liest es mit
# `cockpit ereignisse`. Eingebunden als letzter Job, der auf die anderen wartet und immer läuft:
#   melden:
#     needs: [bauen, ausrollen]
#     if: always()
#     permissions: { contents: read, id-token: write }
#     uses: cloud-rust/werkzeuge-oeffentlich/.github/workflows/cockpit-ereignis.yml@main
#     with:
#       quelle: ausrollen
#       ergebnis: ${{ contains(needs.*.result, 'failure') && 'failure' || needs.ausrollen.result }}
# Aus dem Ergebnis folgt die Schwere: success ist info, failure fehler, cancelled und skipped
# warnung. Aufgabe und Vorhaben nimmt das Cockpit aus dem Branch oder aus grund (A-…, V-…).
# Anmeldung wie in cockpit-melden.yml mit einem OIDC-Token von GitHub (Audience cockpit), ohne
# Geheimnis. Scheitert das Melden, warnt der Job nur: Ein Lauf wird nicht rot, weil das Cockpit
# gerade nicht antwortet.
# konvention-ausnahme: run-logik: ein einziger Aufruf ans Cockpit; liegt öffentlich, damit auch öffentliche Repos ihn einbinden können (A-137)
name: Cockpit Ereignis

on:
  workflow_call:
    inputs:
      quelle:
        description: Was gelaufen ist, klein, z. B. ausrollen, kandidat, release, prod-einspielen
        type: string
        required: true
      ergebnis:
        description: Ergebnis des Laufs (success, failure, cancelled, skipped), meist aus needs.<job>.result
        type: string
        required: true
      text:
        description: Was gelaufen ist, für das Event-Center; das Ergebnis hängt der Workflow an (ohne Text die Quelle)
        type: string
        required: false
      grund:
        description: Anlass mit Aufgabe oder Vorhaben (A-042, V-07), wenn der Branch sie nicht nennt
        type: string
        required: false
      cockpit_url:
        description: Andere Cockpit-Instanz als Cockpit live (https://cockpit.rust-infra.de)
        type: string
        required: false

permissions: {}

jobs:
  melden:
    name: Cockpit Ereignis
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ereignis melden
        env:
          COCKPIT_URL: ${{ inputs.cockpit_url || vars.COCKPIT_URL || 'https://cockpit.rust-infra.de' }}
          QUELLE: ${{ inputs.quelle }}
          ERGEBNIS: ${{ inputs.ergebnis }}
          TEXT: ${{ inputs.text }}
          GRUND: ${{ inputs.grund }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.sha }}
          LAUF: ${{ github.run_id }}
          LAUF_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          case "$ERGEBNIS" in
            success) schwere=info; wie="erfolgreich" ;;
            failure) schwere=fehler; wie="fehlgeschlagen" ;;
            cancelled) schwere=warnung; wie="abgebrochen" ;;
            *) schwere=warnung; wie="übersprungen" ;;
          esac
          text="${TEXT:-$QUELLE}: $wie"
          aufgabe=$(printf %s "$GRUND" | grep -oiE '\bA-[0-9]+\b' | head -1 || true)
          vorhaben=$(printf %s "$GRUND" | grep -oiE '\bV-[0-9]+\b' | head -1 || true)
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::notice::Kein OIDC-Token verfügbar (permissions: id-token: write fehlt), nichts gemeldet"
            exit 0
          fi
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=cockpit" | jq -r .value)
          echo "::add-mask::$token"
          daten=$(jq -n --arg quelle "$QUELLE" --arg schwere "$schwere" --arg text "$text" --arg branch "$BRANCH" \
            --arg commit "$SHA" --arg lauf "$LAUF" --arg url "$LAUF_URL" --arg aufgabe "$aufgabe" --arg vorhaben "$vorhaben" \
            '{quelle: $quelle, schwere: $schwere, text: $text, branch: $branch, commit: $commit, lauf: $lauf, url: $url}
             + (if $aufgabe != "" then {aufgabe: ($aufgabe | ascii_upcase)} else {} end)
             + (if $vorhaben != "" then {vorhaben: ($vorhaben | ascii_upcase)} else {} end)')
          curl -sS --fail-with-body -X POST "${COCKPIT_URL%/}/__cockpit/api/ereignisse" \
            -H "content-type: application/json" -H "Authorization: Bearer $token" -d "$daten" \
            || echo "::warning::Cockpit hat das Ereignis nicht angenommen ($QUELLE $wie)"
